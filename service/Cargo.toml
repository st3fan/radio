[package]
name = "radiod"
version = "0.5.0"
edition = "2024"
rust-version = "1.97"
description = "Internet radio daemon with an HTTP API and a hard volume cap"

[dependencies]
# Only the libraries we use: avformat (format), avcodec (codec), and
# swresample. Keeps libavfilter/libavdevice off the Pi.
#
# non-exhaustive-enums: Raspberry Pi OS ships a patched FFmpeg whose
# headers add extra pixel formats (AV_PIX_FMT_RPI4_*, SAND*). Without a
# catch-all, ffmpeg-next's From<AVPixelFormat> match is then non-exhaustive
# and the crate fails to build natively on the Pi. This feature adds the
# wildcard arm so one `cargo build` works everywhere — the Pi, the Debian
# cross/release builds, and macOS. radiod is audio-only and never converts
# a pixel format, so the wildcard's `unimplemented!()` is unreachable here.
# (The alternative, ffmpeg-next/rpi, would break the Debian/macOS builds:
# it references RPi pixel constants that only exist in the Pi's headers.)
ffmpeg-next = { version = "9.0.0", default-features = false, features = [
    "codec",
    "format",
    "software-resampling",
    "non-exhaustive-enums",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = "3.3.0"

# The control plane: a current-thread tokio runtime serving the loopback
# API via hyper. The audio path stays on blocking OS threads.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt", "net", "signal", "sync", "time", "macros", "io-util"] }

# The built-in website: minijinja renders the page (templates embedded in
# the binary; --web-dir loads them from disk for dev). Pure Rust, ~no deps.
minijinja = "2"

# The embedded AirPlay 2 receiver (milestone 11): network -> PCM + events,
# pure Rust (symphonia AAC, RustCrypto, zbus for Avahi), runs on our tokio
# runtime. The bridge into the pipeline lives in src/airplay.rs.
openairplay2 = { git = "https://github.com/st3fan/openairplay2" }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.9"

# .deb packaging for amd64/arm64/armhf via ./build-deb.sh. Depends are
# pinned to trixie's package names (identical across the three arches);
# cargo-deb's automatic shlibdeps is unreliable for cross builds.
[package.metadata.deb]
name = "radiod"
maintainer = "Stefan Arentz <stefan.arentz@gmail.com>"
copyright = "2026 Stefan Arentz"
extended-description = """\
Internet radio daemon: plays an icecast stream (from a .pls playlist URL, \
e.g. SomaFM) to an ALSA device, controlled over an HTTP API on loopback. \
The output level is hard-capped by the max_volume setting."""
section = "sound"
priority = "optional"
depends = "libavformat61, libavcodec61, libavutil59, libswresample5, libasound2t64, libc6"
# AirPlay needs Avahi for the _airplay._tcp advertisement; without it the
# receiver degrades to radio-only instead of failing, hence Recommends.
recommends = "avahi-daemon"
# The website moved into radiod; upgrading removes the old PHP package
# (lighttpd/php-fpm stay installed but idle — purge them by hand).
conflicts = "radio-website"
replaces = "radio-website"
assets = [
    ["target/release/radiod", "usr/bin/", "755"],
    ["../deploy/config.toml.example", "etc/radio/config.toml", "644"],
]
conf-files = ["/etc/radio/config.toml"]
maintainer-scripts = "../deploy/debian"

[package.metadata.deb.systemd-units]
unit-scripts = "../deploy"
enable = true
start = true
# Upgrades must swap the running daemon, not leave the old binary playing
# until someone remembers to restart (found upgrading muzak to 0.2.0).
restart-after-upgrade = true
