# Builds the .deb packages and attaches them to the GitHub Release that
# triggered the run. Publishing a release (from a v* tag) is the ONLY event
# that builds .debs — nothing runs on pushes or pull requests.
#
# amd64 and arm64 build NATIVELY inside debian:trixie containers — amd64 on
# ubuntu-latest, arm64 on the free public arm64 runners — and armhf (ARMv7)
# cross-compiles via Debian multiarch on ubuntu-latest (no 32-bit ARM
# runners exist; its tests are covered by the other legs). The same
# service/build-deb.sh script is used here and on the box.

name: Release

on:
  release:
    types: [published]

defaults:
  run:
    shell: bash

jobs:
  radiod:
    name: radiod ${{ matrix.arch }}
    # id-token + attestations: sign SLSA build provenance for the .deb
    # (verify with `gh attestation verify`). This job never writes the repo.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      # One leg's failure (e.g. a docker-pull flake on one runner) must not
      # cancel the other architectures' builds.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            setup: native
          - arch: arm64
            runner: ubuntu-24.04-arm
            setup: native
          - arch: armhf
            runner: ubuntu-latest
            setup: cross
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    steps:
      # git must be present before checkout, or actions/checkout silently
      # falls back to a tarball download without a .git directory.
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git ca-certificates curl

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./service/setup-build.sh ${{ matrix.setup }}

      # trixie's rustc is older than the crate's rust-version; use rustup.
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: service
          key: ${{ matrix.arch }}

      # The armhf leg cross-compiles on an amd64 host; running cargo test
      # there would just repeat the amd64 leg's tests.
      - name: Test
        if: matrix.setup == 'native'
        working-directory: service
        run: cargo test

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb
        run: ./service/build-deb.sh ${{ matrix.arch }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: service/target/debian/radiod_*_${{ matrix.arch }}.deb

      - uses: actions/upload-artifact@v4
        with:
          name: radiod-${{ matrix.arch }}
          path: service/target/debian/radiod_*_${{ matrix.arch }}.deb
          if-no-files-found: error

  release-assets:
    name: Attach release assets
    needs: radiod
    runs-on: ubuntu-latest
    container: debian:trixie
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y git ca-certificates gh

      - uses: actions/checkout@v4

      # The tag is the single version for the release: it must match
      # radiod's Cargo.toml (strict for real releases; warn-only for
      # prereleases so release-candidate tags can exercise this workflow).
      - name: Check tag matches radiod version
        run: |
          version="${TAG#v}"
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' service/Cargo.toml | head -1)
          if [ "$version" != "$crate" ]; then
            message="tag $TAG does not match service/Cargo.toml version $crate"
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then
              echo "::warning::$message (allowed: prerelease)"
            else
              echo "::error::$message"
              exit 1
            fi
          fi

      - name: Build website .deb
        run: RADIO_WEBSITE_VERSION="${TAG#v}-1" ./deploy/build-website-deb.sh

      - name: Attest website build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: radio-website_*_all.deb

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach .debs and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv radio-website_*_all.deb dist/
          cd dist
          sha256sum -- * > SHA256SUMS
          # --repo: skip gh's git-based repo detection, which trips over
          # the container/host ownership mismatch of the workspace.
          gh release upload --repo "$GITHUB_REPOSITORY" "$TAG" --clobber -- *
