# Builds the .deb packages and attaches them to the GitHub Release that
# triggered the run. Publishing a release (from a v* tag) is the ONLY event
# that builds .debs — nothing runs on pushes or pull requests.
#
# Both radiod jobs build NATIVELY inside debian:trixie containers — amd64 on
# ubuntu-latest, arm64 on the free public arm64 runners — so CI contains no
# cross-compilation and the userland matches the build box exactly. The same
# service/build-deb.sh script is used here and on the box.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  radiod:
    name: radiod ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    steps:
      # git must be present before checkout, or actions/checkout silently
      # falls back to a tarball download without a .git directory.
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git ca-certificates curl

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./service/setup-build.sh

      # trixie's rustc is older than the crate's rust-version; use rustup.
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: service
          key: ${{ matrix.arch }}

      - name: Test
        working-directory: service
        run: cargo test

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb
        run: ./service/build-deb.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: radiod-${{ matrix.arch }}
          path: service/target/debian/radiod_*_${{ matrix.arch }}.deb
          if-no-files-found: error

  release-assets:
    name: Attach release assets
    needs: radiod
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y git ca-certificates gh

      - uses: actions/checkout@v4

      # The tag is the single version for the release: it must match
      # radiod's Cargo.toml (strict for real releases; warn-only for
      # prereleases so release-candidate tags can exercise this workflow).
      - name: Check tag matches radiod version
        run: |
          version="${TAG#v}"
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' service/Cargo.toml | head -1)
          if [ "$version" != "$crate" ]; then
            message="tag $TAG does not match service/Cargo.toml version $crate"
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then
              echo "::warning::$message (allowed: prerelease)"
            else
              echo "::error::$message"
              exit 1
            fi
          fi

      - name: Build website .deb
        run: RADIO_WEBSITE_VERSION="${TAG#v}-1" ./deploy/build-website-deb.sh

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach .debs and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv radio-website_*_all.deb dist/
          cd dist
          sha256sum -- * > SHA256SUMS
          gh release upload "$TAG" --clobber -- *
