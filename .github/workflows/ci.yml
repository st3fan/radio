# Tests every pull request (and main) in the same environment the release
# builds use — debian:trixie containers, running as root — so
# environment-dependent failures surface at PR time, not release time
# (the v0.4.0 release was failed by a test that only misbehaves as root).
# Building .debs stays release-only.

name: CI

# Documentation-only changes (plans, notes, runbooks, READMEs) have
# nothing for cargo to check.
on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: debian:trixie
    permissions:
      contents: read
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git ca-certificates curl

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./service/setup-build.sh

      # radiod links its own minimal FFmpeg rather than Debian's
      # libavcodec (see notes/dependencies.md), so there is nothing for
      # pkg-config to find until this has run. service/.cargo/config.toml
      # takes care of PKG_CONFIG_PATH from here.
      - name: Build the minimal FFmpeg
        run: ./service/build-ffmpeg.sh amd64

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile default
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: service
          key: ci

      - name: Test
        working-directory: service
        run: cargo test

      - name: Clippy
        working-directory: service
        run: cargo clippy --all-targets -- -D warnings

      - name: Format
        working-directory: service
        run: cargo fmt --check
